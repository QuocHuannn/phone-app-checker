name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## STOP: never paste secrets or personal data
        **Do not paste phone numbers, `checker.config.json`, `api_hash` / `api_id`, session files (anything under `data/`), `report.csv` contents, QR codes or pairing codes.** Replace numbers with `+84901234567`-style placeholders. Security problems: use [private reporting](https://github.com/QuocHuannn/phone-app-checker/security/advisories/new), not an issue.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I removed all real phone numbers, keys, sessions and QR/pairing codes from this report.
          required: true
        - label: I searched existing issues.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran (with placeholders), input shape (a few fake rows is enough).
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app is involved?
      multiple: true
      options:
        - Telegram
        - WhatsApp
        - Zalo
        - Viber
        - LINE
        - Threema
        - Matrix
        - None / general
  - type: input
    id: version
    attributes:
      label: Output of `phone-app-checker --version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - macOS portable archive (GitHub Release)
        - From source (git clone)
  - type: input
    id: platform
    attributes:
      label: OS, CPU and Node.js version
      placeholder: macOS 15.1, Apple M2, Node 24.14 (portable archive: bundled)
  - type: textarea
    id: doctor
    attributes:
      label: Output of `phone-app-checker doctor` and the failing command
      description: Phone numbers are masked by the tool; still check the text before pasting.
      render: text
