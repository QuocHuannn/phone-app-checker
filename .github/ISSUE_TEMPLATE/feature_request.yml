name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste phone numbers, keys, sessions or reports.** Requests that would help check people without their consent, send messages, or collect profile data will be declined; see [responsible use](https://github.com/QuocHuannn/phone-app-checker/blob/main/docs/responsible-use.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this myself.
