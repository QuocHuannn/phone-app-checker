name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, node: "24" }
          - { os: ubuntu-24.04, node: "24" }
          - { os: ubuntu-24.04, node: "22.18.0" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Third-party licence notice is up to date
        run: npm run licenses:check
      - name: Tests (isolated HOME)
        # The suite also isolates HOME itself (tests/setup/); this keeps child processes and npm away from the runner's real home too.
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          npm test
      - name: Smoke test (test-only adapter)
        run: |
          export HOME="$RUNNER_TEMP/home"
          npm run smoke

  audit:
    name: npm audit (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
