name: Release

# Builds the macOS Apple Silicon portable archive for a version tag, verifies it in a clean room,
# and attaches the archive and its SHA-256 to the GitHub Release (created if it does not exist).
# Uses only the automatic GITHUB_TOKEN; no other secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: build and verify (macos-14)
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Tag matches package.json version and sits on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG ($GITHUB_SHA) is not an ancestor of origin/main; release only commits that were merged to main" >&2
            exit 1
          fi
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/changelog-section.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changelog-section.md"; then
            echo "CHANGELOG.md has no non-empty section for $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run licenses:check
      - name: Tests
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          npm test
      - name: Build archive
        run: npm run release:build
      - name: Verify archive (clean room, checks V1-V20)
        run: npm run release:verify
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 -c "phone-app-checker-${VERSION}-macos-arm64.tar.gz.sha256"
          ls -l "phone-app-checker-${VERSION}-macos-arm64.tar.gz"*
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: phone-app-checker-${{ env.VERSION }}-macos-arm64
          path: |
            dist/phone-app-checker-${{ env.VERSION }}-macos-arm64.tar.gz
            dist/phone-app-checker-${{ env.VERSION }}-macos-arm64.tar.gz.sha256
          if-no-files-found: error
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="dist/phone-app-checker-${VERSION}-macos-arm64.tar.gz"
          notes="$RUNNER_TEMP/notes.md"
          {
            cat .github/release-template.md
            printf '## What is in %s\n\n' "$TAG"
            cat "$RUNNER_TEMP/changelog-section.md"
            printf '\n<!-- checksums -->\n### SHA-256\n\n```\n'
            cat "$archive.sha256"
            printf '```\n'
          } > "$notes"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "phone-app-checker ${VERSION}" --notes-file "$notes"
          fi
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber
          body="$(gh release view "$TAG" --json body --jq .body)"
          case "$body" in
            *"<!-- checksums -->"*) ;;
            *)
              # A release that existed before this run keeps its text; only the checksum block is appended.
              {
                printf '%s\n\n<!-- checksums -->\n### SHA-256\n\n```\n' "$body"
                cat "$archive.sha256"
                printf '```\n'
              } > "$RUNNER_TEMP/notes-existing.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes-existing.md"
              ;;
          esac
